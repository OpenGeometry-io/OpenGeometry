name: Release Package

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  issues: read
  pull-requests: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      current-version: ${{ steps.current-version.outputs.version }}
      npm-exists: ${{ steps.npm-check.outputs.exists }}
      should-publish: ${{ steps.publish-decision.outputs.should-publish }}
    
    steps:
      - name: Checkout current commit
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Get current version
        id: current-version
        run: |
          CURRENT_VERSION=$(node -p "require('./main/package.json').version")
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: Check if current version exists on NPM
        id: npm-check
        run: |
          PACKAGE_NAME=$(node -p "require('./main/package.json').name")
          CURRENT_VERSION="${{ steps.current-version.outputs.version }}"
          
          echo "Checking if $PACKAGE_NAME@$CURRENT_VERSION exists on NPM..."
          
          if npm view "$PACKAGE_NAME@$CURRENT_VERSION" version 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Version $CURRENT_VERSION already exists on NPM"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "❌ Version $CURRENT_VERSION does not exist on NPM"
          fi

      - name: Decide whether to publish
        id: publish-decision
        run: |
          NPM_EXISTS="${{ steps.npm-check.outputs.exists }}"
          CURRENT_VERSION="${{ steps.current-version.outputs.version }}"

          echo "Exists on NPM: $NPM_EXISTS"
          echo "Current Version: $CURRENT_VERSION"

          if [[ "$NPM_EXISTS" == "false" ]]; then
            echo "should-publish=true" >> $GITHUB_OUTPUT
            echo "✅ Will publish: Version $CURRENT_VERSION is not on NPM"
          else
            echo "should-publish=false" >> $GITHUB_OUTPUT
            echo "⏭️ Will skip: Version $CURRENT_VERSION already exists on NPM"
          fi

  build-and-publish:
    needs: check-version
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && needs.check-version.outputs.should-publish == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.88.0'
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - id: wasm-pack
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-0.13.1-${{ runner.os }}-${{ runner.arch }}

      - name: Install wasm-pack
        if: steps.wasm-pack.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --version 0.13.1 --locked

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            main/opengeometry/target
            main/opengeometry/test-support/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('main/**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Node.js dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('main/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        working-directory: main
        run: npm ci

      - name: Fetch crate dependencies
        working-directory: main
        run: |
          git ls-files '*Cargo.lock' | while read -r lock; do
            cargo fetch --locked --manifest-path "$(dirname "$lock")/Cargo.toml"
          done

      - name: Run build
        working-directory: main
        run: npm run build

      - name: Verify dist directory
        run: |
          echo "Checking dist directory contents:"
          ls -la main/dist/
          echo "Checking if package.json exists in dist:"
          if [ -f "main/dist/package.json" ]; then
            echo "✅ package.json found in dist"
            echo "Dist package version: $(node -p "require('./main/dist/package.json').version")"
          else
            echo "❌ package.json not found in dist"
            exit 1
          fi

      - name: Run checks
        working-directory: main
        run: npm run check

      - name: Final NPM existence check
        id: final-npm-check
        run: |
          PACKAGE_NAME=$(node -p "require('./main/dist/package.json').name")
          VERSION="${{ needs.check-version.outputs.current-version }}"
          
          echo "🔍 Final check before publishing..."
          if npm view "$PACKAGE_NAME@$VERSION" version 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️ Version $VERSION now exists on NPM (may have been published by another process)"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✅ Version $VERSION confirmed not on NPM, proceeding with publish"
          fi

      - name: Publish to NPM
        if: steps.final-npm-check.outputs.exists == 'false'
        working-directory: main/dist
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: steps.final-npm-check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.current-version }}
          name: Release v${{ needs.check-version.outputs.current-version }}
          body: |
            ## Changes in v${{ needs.check-version.outputs.current-version }}
            
            Published from a manual run of the release workflow.
            
            ### Package Information
            - **Package Name**: opengeometry  
            - **Version**: ${{ needs.check-version.outputs.current-version }}
            - **NPM**: https://www.npmjs.com/package/opengeometry
            
            ### Installation
            ```bash
            npm install opengeometry@${{ needs.check-version.outputs.current-version }}
            ```
            
            ### Build Information
            - **Commit**: ${{ github.sha }}
            - **Workflow**: ${{ github.run_id }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: steps.final-npm-check.outputs.exists == 'false'
        run: |
          echo "## 🚀 Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ needs.check-version.outputs.current-version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ✅ Successfully published to NPM" >> $GITHUB_STEP_SUMMARY
          echo "**Package**: [opengeometry@${{ needs.check-version.outputs.current-version }}](https://www.npmjs.com/package/opengeometry)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Publish Reason" >> $GITHUB_STEP_SUMMARY
          echo "- Manual run: Version was not on NPM" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "- Check the [NPM package page](https://www.npmjs.com/package/opengeometry)" >> $GITHUB_STEP_SUMMARY
          echo "- Verify the [GitHub release](https://github.com/${{ github.repository }}/releases)" >> $GITHUB_STEP_SUMMARY

      - name: Already Published Summary
        if: steps.final-npm-check.outputs.exists == 'true'
        run: |
          echo "## ⚠️ Publish Skipped" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Reason**: Version ${{ needs.check-version.outputs.current-version }} already exists on NPM" >> $GITHUB_STEP_SUMMARY
          echo "**Package**: [opengeometry@${{ needs.check-version.outputs.current-version }}](https://www.npmjs.com/package/opengeometry)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This likely means the package was published by another process while this build was running." >> $GITHUB_STEP_SUMMARY

  skip-build:
    needs: check-version
    runs-on: ubuntu-latest
    if: needs.check-version.outputs.should-publish == 'false'
    
    steps:
      - name: Skip message
        run: |
          echo "## ⏭️ Build Skipped" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Reason**: This version already exists on NPM" >> $GITHUB_STEP_SUMMARY
          echo "**Current Version**: ${{ needs.check-version.outputs.current-version }}" >> $GITHUB_STEP_SUMMARY
          echo "**NPM Status**: ✅ Already published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### To publish a new release:" >> $GITHUB_STEP_SUMMARY
          echo "Bump the version in main/package.json, main/package-lock.json, main/opengeometry/Cargo.toml, main/opengeometry/Cargo.lock and main/opengeometry/test-support/Cargo.lock, merge to main, then start this workflow by hand on main." >> $GITHUB_STEP_SUMMARY