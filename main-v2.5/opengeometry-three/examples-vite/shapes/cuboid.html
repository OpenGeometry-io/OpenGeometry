<!DOCTYPE html>
<html lang="en">
  <head>
    <title>OpenGeometry Cuboid Example</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Simple OpenGeometry cuboid example for Three.js." />
    <meta name="author" content="Vishwajeet Mane" />
    <link rel="stylesheet" href="../theme.css" />
  </head>
  <body class="og-example-page">
    <div class="og-badge-title-card">
      <a href="../index.html" class="og-badge-title-link">Back</a>
      <span class="og-badge-title">Cuboid</span>
    </div>

    <aside class="og-controls">
      <h3>Cuboid</h3>
      <p class="og-control-summary">
        Keep this one simple: width, height, depth, and an outline toggle.
      </p>

      <label class="og-control-row" data-control="width">
        <div class="og-control-header">
          <span class="og-control-label-chip">Width</span>
          <code class="og-control-value" data-value>2</code>
        </div>
        <div class="og-control-range">
          <input data-range type="range" min="0.5" max="4" step="0.1" value="2" />
          <input data-number type="number" min="0.5" max="4" step="0.1" value="2" />
        </div>
      </label>

      <label class="og-control-row" data-control="height">
        <div class="og-control-header">
          <span class="og-control-label-chip">Height</span>
          <code class="og-control-value" data-value>1.6</code>
        </div>
        <div class="og-control-range">
          <input data-range type="range" min="0.5" max="4" step="0.1" value="1.6" />
          <input data-number type="number" min="0.5" max="4" step="0.1" value="1.6" />
        </div>
      </label>

      <label class="og-control-row" data-control="depth">
        <div class="og-control-header">
          <span class="og-control-label-chip">Depth</span>
          <code class="og-control-value" data-value>1.2</code>
        </div>
        <div class="og-control-range">
          <input data-range type="range" min="0.5" max="4" step="0.1" value="1.2" />
          <input data-number type="number" min="0.5" max="4" step="0.1" value="1.2" />
        </div>
      </label>

      <label class="og-control-row" data-control="outline">
        <div class="og-control-header">
          <span class="og-control-label-chip">Outline</span>
        </div>
        <div class="og-control-bool">
          <input data-toggle type="checkbox" class="og-toggle" aria-label="Outline" checked />
          <span class="og-control-bool-state" data-state>Enabled</span>
        </div>
      </label>
      <p id="status" class="og-control-summary" role="status" aria-live="polite">Loading kernel…</p>
    </aside>

    <div id="app"></div>

    <script>
      if (location.protocol === 'file:') document.querySelector('#status').textContent = 'Open this page through the Vite server.';
      window.addEventListener('error', (event) => { document.querySelector('#status').textContent = `Error: ${event.message}`; }, true);
      window.addEventListener('unhandledrejection', (event) => { document.querySelector('#status').textContent = `Error: ${String(event.reason)}`; });
    </script>
    <script type="module" src="./cuboid.ts"></script>
  </body>
</html>
