<!DOCTYPE html>
<html lang="en">
  <head>
    <title>OpenGeometry Boolean Operations Example</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Kernel-backed solid boolean operations for browser CAD and AEC workflows with OpenGeometry."
    />
    <meta name="author" content="Vishwajeet Mane" />
    <link rel="stylesheet" href="./theme.css" />
  </head>
  <body class="og-example-page">
    <div class="og-badge-title-card">
      <a href="./index.html" class="og-badge-title-link">Back</a>
      <span class="og-badge-title">Analytic Solid Booleans</span>
    </div>

    <aside class="og-controls">
      <h3>Solid Boolean</h3>
      <p class="og-control-summary">
        The source solids are on the left and the exact kernel result is on the right.
        This 2.5 example uses two cuboids because sphere primitives are planned for a later milestone.
      </p>

      <label class="og-control-row" data-control="operation">
        <div class="og-control-header">
          <span class="og-control-label-chip">Operation</span>
        </div>
        <select class="og-control-select" data-select aria-label="Operation">
          <option value="union">Union</option>
          <option value="intersection">Intersection</option>
          <option value="subtraction" selected>Subtraction (inherit host)</option>
          <option value="subtraction-override">Subtraction (override green)</option>
        </select>
      </label>

      <label class="og-control-row" data-control="offset-x">
        <div class="og-control-header">
          <span class="og-control-label-chip">Tool Offset X</span>
          <code class="og-control-value" data-value>0</code>
        </div>
        <div class="og-control-range">
          <input data-range type="range" min="-0.5" max="0.5" step="0.05" value="0" />
          <input data-number type="number" min="-0.5" max="0.5" step="0.05" value="0" />
        </div>
      </label>
      <pre id="result-report" style="white-space:pre-wrap" aria-live="polite"></pre>
      <p id="error" role="alert" style="color:#b42318"></p>
      <p id="status" class="og-control-summary" role="status" aria-live="polite">Loading kernel…</p>
    </aside>

    <div id="app"></div>

    <script>
      if (location.protocol === 'file:') document.querySelector('#status').textContent = 'Open this page through the Vite server.';
      window.addEventListener('error', (event) => { document.querySelector('#status').textContent = `Error: ${event.message}`; }, true);
      window.addEventListener('unhandledrejection', (event) => { document.querySelector('#status').textContent = `Error: ${String(event.reason)}`; });
    </script>
    <script type="module" src="./showcase/boolean.ts"></script>
  </body>
</html>
