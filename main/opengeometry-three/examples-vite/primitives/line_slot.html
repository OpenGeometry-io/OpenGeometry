<!DOCTYPE html>
<html lang="en">
  <head>
    <title>OpenGeometry Line Slot Example</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Simple OpenGeometry line slot example for Three.js." />
    <meta name="author" content="Vishwajeet Mane" />
  </head>
  <body class="og-example-page">
    <div class="og-badge-title-card">
      <a href="../index.html" class="og-badge-title-link">Back</a>
      <span class="og-badge-title">Line Slot</span>
    </div>

    <aside class="og-controls">
      <h3>Line Slot</h3>
      <p class="og-control-summary">
        A line slot is a closed profile with two straight sides and two semicircular ends. Length is
        measured tip to tip and always stays larger than the width.
      </p>

      <label class="og-control-row" data-control="length">
        <div class="og-control-header">
          <span class="og-control-label-chip">Length</span>
          <code class="og-control-value" data-value>4</code>
        </div>
        <div class="og-control-range">
          <input data-range type="range" min="1.5" max="8" step="0.1" value="4" />
          <input data-number type="number" min="1.5" max="8" step="0.1" value="4" />
        </div>
      </label>

      <label class="og-control-row" data-control="width">
        <div class="og-control-header">
          <span class="og-control-label-chip">Width</span>
          <code class="og-control-value" data-value>1</code>
        </div>
        <div class="og-control-range">
          <input data-range type="range" min="0.2" max="1.4" step="0.1" value="1" />
          <input data-number type="number" min="0.2" max="1.4" step="0.1" value="1" />
        </div>
      </label>

      <label class="og-control-row" data-control="segments">
        <div class="og-control-header">
          <span class="og-control-label-chip">Cap Segments</span>
          <code class="og-control-value" data-value>32</code>
        </div>
        <div class="og-control-range">
          <input data-range type="range" min="3" max="64" step="1" value="32" />
          <input data-number type="number" min="3" max="64" step="1" value="32" />
        </div>
      </label>

      <label class="og-control-row" data-control="fat-lines">
        <div class="og-control-header">
          <span class="og-control-label-chip">Fat Lines</span>
        </div>
        <div class="og-control-bool">
          <input data-toggle type="checkbox" class="og-toggle" aria-label="Fat lines" />
          <span class="og-control-bool-state" data-state>Disabled</span>
        </div>
      </label>
    </aside>

    <div id="app"></div>

    <script type="module">
      import "../src/styles/theme.css";
      import * as THREE from "three";
      import { OrbitControls } from "three/examples/jsm/controls/OrbitControls.js";
      import Stats from "three/examples/jsm/libs/stats.module.js";
      import wasmUrl from "../../../opengeometry/pkg/opengeometry_bg.wasm?url";
      import { OpenGeometry, LineSlot, Vector3 } from "opengeometry";

      const app = document.getElementById("app");
      if (!app) {
        throw new Error("Missing #app container");
      }

      const config = {
        length: 4,
        width: 1,
        segments: 32,
        fatLines: false,
      };

      let lineSlot = null;

      function formatNumber(value) {
        return Number(value).toFixed(2).replace(/\.?0+$/, "");
      }

      function mountStats() {
        const stats = new Stats();
        stats.showPanel(0);
        stats.dom.style.position = "fixed";
        stats.dom.style.left = "12px";
        stats.dom.style.bottom = "12px";
        stats.dom.style.top = "auto";
        stats.dom.style.zIndex = "1000";
        document.body.appendChild(stats.dom);
        return stats;
      }

      function attachNumberControl(name, onChange) {
        const row = document.querySelector(`[data-control="${name}"]`);
        const range = row?.querySelector("[data-range]");
        const number = row?.querySelector("[data-number]");
        const value = row?.querySelector("[data-value]");

        if (!row || !range || !number || !value) {
          throw new Error(`Missing number control: ${name}`);
        }

        const commit = (nextValue) => {
          const parsed = Number(nextValue);
          number.setCustomValidity("");
          if (String(nextValue).trim() === "" || !Number.isFinite(parsed)
            || (number.min !== "" && parsed < Number(number.min))
            || (number.max !== "" && parsed > Number(number.max))) {
            number.setCustomValidity("Enter a finite value within the displayed limits.");
            number.reportValidity();
            return;
          }

          range.value = String(parsed);
          number.value = String(parsed);
          value.textContent = formatNumber(parsed);
          onChange(parsed);
        };

        range.addEventListener("input", () => commit(range.value));
        number.addEventListener("input", () => commit(number.value));
        commit(range.value);
      }

      function attachBooleanControl(name, onChange) {
        const row = document.querySelector(`[data-control="${name}"]`);
        const toggle = row?.querySelector("[data-toggle]");
        const state = row?.querySelector("[data-state]");

        if (!row || !toggle || !state) {
          throw new Error(`Missing boolean control: ${name}`);
        }

        const commit = (checked) => {
          toggle.checked = checked;
          state.textContent = checked ? "Enabled" : "Disabled";
          onChange(checked);
        };

        toggle.addEventListener("change", () => commit(toggle.checked));
        commit(toggle.checked);
      }

      function updateLineSlot() {
        if (!lineSlot) {
          return;
        }

        try {
          lineSlot.setConfig({
            center: new Vector3(0, 0, 0),
            length: config.length,
            width: config.width,
            segments: config.segments,
            color: 0x7c3aed,
            fatLines: config.fatLines,
            lineWidth: config.fatLines ? 10 : 2,
          });
        } catch (error) {
          console.error("[line slot] rejected config", { ...config }, error);
          return;
        }

        console.groupCollapsed("[line slot] updated");
        console.log("Config", { ...config });
        console.groupEnd();
      }

      async function main() {
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xeef2ff);

        const camera = new THREE.PerspectiveCamera(
          55,
          window.innerWidth / window.innerHeight,
          0.1,
          100
        );
        camera.position.set(5.6, 4.2, 6.4);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        app.replaceChildren(renderer.domElement);

        const stats = mountStats();
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 0.2, 0);
        controls.update();

        scene.add(new THREE.GridHelper(20, 20, 0x4460ff, 0xd5ddff));
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));

        const light = new THREE.DirectionalLight(0xffffff, 1.1);
        light.position.set(6, 8, 4);
        scene.add(light);

        await OpenGeometry.create({ wasmURL: wasmUrl });

        lineSlot = new LineSlot({
          center: new Vector3(0, 0, 0),
          length: config.length,
          width: config.width,
          segments: config.segments,
          color: 0x7c3aed,
        });
        scene.add(lineSlot);

        attachNumberControl("length", (value) => {
          config.length = value;
          updateLineSlot();
        });
        attachNumberControl("width", (value) => {
          config.width = value;
          updateLineSlot();
        });
        attachNumberControl("segments", (value) => {
          config.segments = Math.round(value);
          updateLineSlot();
        });
        attachBooleanControl("fat-lines", (value) => {
          config.fatLines = value;
          updateLineSlot();
        });

        updateLineSlot();

        renderer.setAnimationLoop(() => {
          stats.update();
          controls.update();
          renderer.render(scene, camera);
        });

        window.addEventListener("resize", () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        });
      }

      void main();
    </script>
  </body>
</html>
