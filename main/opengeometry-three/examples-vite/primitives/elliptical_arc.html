<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenGeometry Analytic Elliptical Arc Example</title>
  </head>
  <body class="og-example-page">
    <div class="og-badge-title-card">
      <a href="../index.html" class="og-badge-title-link">Back</a>
      <span class="og-badge-title">Analytic Elliptical Arc</span>
    </div>
    <aside class="og-controls">
      <h3>Analytic Elliptical Arc</h3>
      <p
        class="og-control-summary">An elliptical arc is one authoritative Ellipse edge. Chord error changes only its render sampling.</p>
      <label class="og-control-row">
        <span class="og-control-label-chip">Major radius</span>
        <input id="major-radius" type="number" min="0.5" max="4" step="0.05"
          value="2.2" required />
      </label>
      <label class="og-control-row">
        <span class="og-control-label-chip">Minor radius</span>
        <input id="minor-radius" type="number" min="0.1" max="4" step="0.05"
          value="1.1" required />
      </label>
      <label class="og-control-row">
        <span class="og-control-label-chip">Start (degrees)</span>
        <input id="start-angle" type="number" min="-360" max="360" step="5"
          value="0" required />
      </label>
      <label class="og-control-row">
        <span class="og-control-label-chip">Sweep (degrees)</span>
        <input id="sweep-angle" type="number" min="-360" max="360" step="5"
          value="270" required />
      </label>
      <label class="og-control-row">
        <span class="og-control-label-chip">Chord error</span>
        <input id="deflection" type="range" min="-3" max="-0.5" step="0.1"
          value="-2" />
      </label>
      <p id="statistics" role="status"></p>
      <p id="selection">Click the curve to inspect its edge.</p>
      <p id="error" role="alert"></p>
    </aside>
    <div id="app"></div>

    <script type="module">
    import "../src/styles/theme.css";
    import * as THREE from "three";
    import { OrbitControls } from "three/examples/jsm/controls/OrbitControls.js";
    import wasmUrl from "../../../opengeometry/pkg/opengeometry_bg.wasm?url";
    import { AnalyticCurve, OpenGeometry } from "opengeometry";

    const input = (id) => document.querySelector(`#${id}`);
    const value = (id) => Number(input(id).value);
    const radians = (id) => THREE.MathUtils.degToRad(value(id));
    const chordError = () => 10 ** value("deflection");
    let scene;
    let curve;

    function createCurve() {
      return new AnalyticCurve({
        kind: "ellipticalArc",
        majorRadius: value("major-radius"),
        minorRadius: value("minor-radius"),
        startAngle: radians("start-angle"),
        sweepAngle: radians("sweep-angle"),
        deflection: chordError(),
        color: 0x329ac7,
      });
    }

    function showStatistics(stats) {
      const brep = JSON.parse(curve.getBrepSerialized());
      input("statistics").textContent =
        `${brep.topology.edges.length} analytic edge · ${stats.segmentCount} render segments`;
    }

    function rebuild() {
      const next = createCurve();
      if (curve) {
        scene.remove(curve);
        curve.dispose();
      }
      curve = next;
      scene.add(curve);
      showStatistics(curve.retessellate(chordError()));
      input("error").textContent = "";
    }

    function attempt(action) {
      try {
        action();
      } catch (failure) {
        input("error").textContent = `Previous result retained. ${String(failure)}`;
      }
    }

    async function initialize() {
      try {
        await OpenGeometry.create({ wasmURL: wasmUrl });
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xeef2ff);
        scene.add(new THREE.GridHelper(12, 12, 0x7188aa, 0xcbd5e1));

        const camera = new THREE.PerspectiveCamera(
          45,
          innerWidth / innerHeight,
          0.1,
          100,
        );
        camera.position.set(6, 7, 7);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(devicePixelRatio);
        input("app").replaceChildren(renderer.domElement);
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        rebuild();
        document.querySelectorAll('input[type="number"]').forEach((control) =>
          control.addEventListener("change", () => attempt(rebuild))
        );
        input("deflection").addEventListener(
          "input",
          () => attempt(() => showStatistics(curve.retessellate(chordError()))),
        );

        const raycaster = new THREE.Raycaster();
        raycaster.params.Line.threshold = 0.08;
        renderer.domElement.addEventListener("pointerdown", (event) => {
          const bounds = renderer.domElement.getBoundingClientRect();
          raycaster.setFromCamera(
            new THREE.Vector2(
              ((event.clientX - bounds.left) / bounds.width) * 2 - 1,
              -((event.clientY - bounds.top) / bounds.height) * 2 + 1,
            ),
            camera,
          );
          const hit = raycaster.intersectObject(curve.line)[0];
          if (hit?.index != null) {
            input("selection").textContent = `Edge ${
              curve.edgeIdForSegment(Math.floor(hit.index / 2))
            }`;
          }
        });

        addEventListener("resize", () => {
          camera.aspect = innerWidth / innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(innerWidth, innerHeight);
        });
        addEventListener("pagehide", () => {
          curve?.dispose();
          controls.dispose();
          renderer.dispose();
        }, { once: true });
        renderer.setAnimationLoop(() => {
          controls.update();
          renderer.render(scene, camera);
        });
      } catch (failure) {
        input("error").textContent = String(failure);
      }
    }

    initialize();
    </script>
  </body>
</html>
