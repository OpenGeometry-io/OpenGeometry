<!DOCTYPE html>
<html lang="en">
  <head>
    <title>OpenGeometry Polygon Boolean Operations</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Simple OpenGeometry polygon boolean example for Three.js."
    />
    <meta name="author" content="Vishwajeet Mane" />
    <style>
      @media (max-width: 640px) {
        body.og-example-page { height: auto; overflow: auto; }
        .og-controls {
          position: relative;
          top: auto;
          right: auto;
          max-height: none;
          margin: 64px 12px 12px;
        }
        #app { height: max(360px, 50vh); }
      }
    </style>
  </head>
  <body class="og-example-page">
    <div class="og-badge-title-card">
      <a href="../index.html" class="og-badge-title-link">Back</a>
      <span class="og-badge-title">Polygon Boolean Operations</span>
    </div>

    <aside class="og-controls">
      <h3>Planar polygon Boolean</h3>
      <p class="og-control-summary">
        Two flat polygons are shown on the left. Their exact 2D union, intersection, or
        subtraction is shown on the right. This operation produces planar regions, not solids.
      </p>

      <label class="og-control-row" data-control="operation">
        <div class="og-control-header">
          <span class="og-control-label-chip">Operation</span>
        </div>
        <select class="og-control-select" data-select aria-label="Operation">
          <option value="union">Union</option>
          <option value="intersection">Intersection</option>
          <option value="subtraction" selected>Subtraction</option>
        </select>
      </label>

      <label class="og-control-row" data-control="offset-x">
        <div class="og-control-header">
          <span class="og-control-label-chip">Tool Offset X</span>
          <code class="og-control-value" data-value>0.45</code>
        </div>
        <div class="og-control-range">
          <input data-range type="range" min="-1.2" max="1.2" step="0.05" value="0.45" />
          <input data-number type="number" min="-1.2" max="1.2" step="0.05" value="0.45" />
        </div>
      </label>
      <pre id="result-report" style="white-space:pre-wrap" aria-live="polite"></pre>
      <p id="error" role="alert" style="color:#b42318"></p>
    </aside>

    <div id="app"></div>

    <script type="module">
      import "../src/styles/theme.css";
      import * as THREE from "three";
      import { OrbitControls } from "three/examples/jsm/controls/OrbitControls.js";
      import Stats from "three/examples/jsm/libs/stats.module.js";
      import wasmUrl from "../../../opengeometry/pkg/opengeometry_bg.wasm?url";
      import {
        booleanRegions2D,
        OpenGeometry,
        Polygon,
        Vector3,
      } from "opengeometry";

      const app = document.getElementById("app");
      if (!app) {
        throw new Error("Missing #app container");
      }

      const config = {
        operation: "subtraction",
        offsetX: 0.45,
      };

      let scene = null;
      let currentGroup = null;
      const readout = document.querySelector("#result-report");
      const errorReadout = document.querySelector("#error");

      function formatNumber(value) {
        return Number(value).toFixed(2).replace(/\.?0+$/, "");
      }

      function mountStats() {
        const stats = new Stats();
        stats.showPanel(0);
        stats.dom.style.position = "fixed";
        stats.dom.style.left = "12px";
        stats.dom.style.bottom = "12px";
        stats.dom.style.top = "auto";
        stats.dom.style.zIndex = "1000";
        document.body.appendChild(stats.dom);
        return stats;
      }

      function attachNumberControl(name, onChange) {
        const row = document.querySelector(`[data-control="${name}"]`);
        const range = row?.querySelector("[data-range]");
        const number = row?.querySelector("[data-number]");
        const value = row?.querySelector("[data-value]");

        if (!row || !range || !number || !value) {
          throw new Error(`Missing number control: ${name}`);
        }

        const commit = (nextValue) => {
          const parsed = Number(nextValue);
          if (String(nextValue).trim() === "" || !Number.isFinite(parsed) || parsed < Number(number.min) || parsed > Number(number.max)) {
            errorReadout.textContent = "Enter a value within the displayed limits; previous preview retained.";
            return;
          }

          range.value = String(parsed);
          number.value = String(parsed);
          value.textContent = formatNumber(parsed);
          onChange(parsed);
        };

        range.addEventListener("input", () => commit(range.value));
        number.addEventListener("input", () => commit(number.value));
        commit(range.value);
      }

      function attachSelectControl(name, onChange) {
        const row = document.querySelector(`[data-control="${name}"]`);
        const select = row?.querySelector("[data-select]");

        if (!row || !select) {
          throw new Error(`Missing select control: ${name}`);
        }

        const commit = (value) => {
          select.value = value;
          onChange(value);
        };

        select.addEventListener("change", () => commit(select.value));
        commit(select.value);
      }

      function disposeObject(object) {
        object.traverse((child) => {
          if (child instanceof Polygon) {
            child.dispose();
            child.polygon.free();
          }
        });
      }

      // booleanRegions2D accepts clockwise outer rings in the XZ plane.
      function rectangle(xMin, zMin, xMax, zMax) {
        return {
          outer: [
            { x: xMin, y: 0, z: zMax },
            { x: xMax, y: 0, z: zMax },
            { x: xMax, y: 0, z: zMin },
            { x: xMin, y: 0, z: zMin },
          ],
          holes: [],
        };
      }

      function ringArea(ring) {
        return Math.abs(ring.reduce((sum, point, index) => {
          const next = ring[(index + 1) % ring.length];
          return sum + point.x * next.z - next.x * point.z;
        }, 0)) / 2;
      }

      function regionArea(region) {
        return ringArea(region.outer) - region.holes.reduce((sum, hole) => sum + ringArea(hole), 0);
      }

      function addPlanarPolygon(group, region, color, xOffset, yOffset = 0, opacity = 1) {
        const toVector = (point) => new Vector3(point.x, point.y, point.z);
        const polygon = new Polygon({
          vertices: region.outer.map(toVector),
          holes: region.holes.map((hole) => hole.map(toVector)),
          color,
        });
        polygon.position.set(xOffset, yOffset, 0);
        polygon.outline = true;
        polygon.material.transparent = opacity < 1;
        polygon.material.opacity = opacity;
        polygon.material.depthWrite = opacity === 1;
        group.add(polygon);
      }

      function rebuildExample() {
        if (!scene) return;

        const nextGroup = new THREE.Group();
        try {
          const base = rectangle(-1.8, -1, 0.6, 0.8);
          const tool = rectangle(-0.5 + config.offsetX, -0.7, 1.1 + config.offsetX, 0.4);
          const regions = booleanRegions2D([base], [tool], config.operation);

          addPlanarPolygon(nextGroup, base, 0x60a5fa, -4, 0, 0.65);
          addPlanarPolygon(nextGroup, tool, 0xf97316, -4, 0.005, 0.65);
          regions.forEach((region) => addPlanarPolygon(nextGroup, region, 0x22c55e, 4));

          if (currentGroup) {
            scene.remove(currentGroup);
            disposeObject(currentGroup);
          }
          currentGroup = nextGroup;
          scene.add(currentGroup);
          readout.textContent = JSON.stringify({
            operation: config.operation,
            geometry: "2D regions",
            regionCount: regions.length,
            area: Number(regions.reduce((sum, region) => sum + regionArea(region), 0).toFixed(6)),
            holes: regions.reduce((sum, region) => sum + region.holes.length, 0),
          }, null, 2);
          errorReadout.textContent = "";
        } catch (failure) {
          disposeObject(nextGroup);
          errorReadout.textContent = `Previous preview retained. ${String(failure)}`;
        }
      }

      async function main() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xeef2ff);

        const camera = new THREE.OrthographicCamera(-7.5, 7.5, 5, -5, 0.1, 100);
        camera.position.set(0, 10, 12);
        function resizeViewer() {
          const aspect = app.clientWidth / app.clientHeight;
          camera.left = -7.5;
          camera.right = 7.5;
          camera.top = 7.5 / aspect;
          camera.bottom = -camera.top;
          camera.updateProjectionMatrix();
          renderer.setSize(app.clientWidth, app.clientHeight);
        }

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        app.replaceChildren(renderer.domElement);
        resizeViewer();

        const stats = mountStats();
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 0, 0);
        controls.update();

        const grid = new THREE.GridHelper(30, 30, 0x4460ff, 0xd5ddff);
        grid.position.y = -0.03;
        scene.add(grid);
        scene.add(new THREE.AmbientLight(0xffffff, 0.82));

        const light = new THREE.DirectionalLight(0xffffff, 1.15);
        light.position.set(7, 9, 5);
        scene.add(light);

        await OpenGeometry.create({ wasmURL: wasmUrl });

        attachSelectControl("operation", (value) => {
          config.operation = value;
          rebuildExample();
        });
        attachNumberControl("offset-x", (value) => {
          config.offsetX = value;
          rebuildExample();
        });

        rebuildExample();

        renderer.setAnimationLoop(() => {
          stats.update();
          controls.update();
          renderer.render(scene, camera);
        });

        window.addEventListener("resize", resizeViewer);
      }

      void main().catch(failure => { errorReadout.textContent = String(failure); });
    </script>
  </body>
</html>
