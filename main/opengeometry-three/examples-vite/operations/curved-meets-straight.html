<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenGeometry Curved Meets Straight Example</title>
    <link rel="stylesheet" href="../theme.css" />
  </head>
  <body class="og-example-page">
    <div class="og-badge-title-card">
      <a href="../index.html" class="og-badge-title-link">Back</a>
      <span class="og-badge-title">Curved Meets Straight</span>
    </div>
    <aside class="og-controls">
      <h3>Curved Meets Straight</h3>
      <p
        class="og-control-summary">A quarter-circle prism, 0.2 m thick and 3 m high, unioned with a straight prism that continues it along the tangent at one end and with another that meets it at a right angle at the other.</p>
      <label class="og-control-row">
        <span class="og-control-label-chip">Tangent reach (m)</span>
        <input id="reach" type="number" min="0.05" max="1" step="0.05"
          value="0.5" required />
      </label>
      <label
        class="og-control-row"><input id="outline" type="checkbox" checked /> Show feature outlines</label>
      <p id="error" role="alert"></p>
      <p id="status" class="og-control-summary" role="status" aria-live="polite">Loading kernel…</p>
    </aside>
    <div id="app"></div>

    <script>
      if (location.protocol === 'file:') document.querySelector('#status').textContent = 'Open this page through the Vite server.';
      window.addEventListener('error', (event) => { document.querySelector('#status').textContent = `Error: ${event.message}`; }, true);
      window.addEventListener('unhandledrejection', (event) => { document.querySelector('#status').textContent = `Error: ${String(event.reason)}`; });
    </script>
    <script type="module" src="./curved-meets-straight.ts"></script>
  </body>
</html>
