<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenGeometry Arc Path Sweep Example</title>
    <link rel="stylesheet" href="../theme.css" />
  </head>
  <body class="og-example-page">
    <div class="og-badge-title-card">
      <a href="../index.html" class="og-badge-title-link">Back</a>
      <span class="og-badge-title">Arc Path Sweep</span>
    </div>
    <aside class="og-controls">
      <h3>Arc Path Sweep</h3>
      <p
        class="og-control-summary">A 0.3 × 1.1 m rectangle swept with caps along two 2 m straight runs joined by a circular arc.</p>
      <p
        class="og-control-summary">The section itself must have straight edges: a section with arc edges is not swept yet.</p>
      <label class="og-control-row" data-control="radius">
        <div class="og-control-header">
          <span class="og-control-label-chip">Bend radius (m)</span>
          <code class="og-control-value" data-value>1</code>
        </div>
        <div class="og-control-range">
          <input data-range type="range" min="0.5" max="4" step="0.1" value="1" />
          <input data-number type="number" min="0.5" max="4" step="0.1" value="1" />
        </div>
      </label>
      <label class="og-control-row" data-control="angle">
        <div class="og-control-header">
          <span class="og-control-label-chip">Sweep angle (°)</span>
          <code class="og-control-value" data-value>90</code>
        </div>
        <div class="og-control-range">
          <input data-range type="range" min="1" max="180" step="1" value="90" />
          <input data-number type="number" min="1" max="180" step="1" value="90" />
        </div>
      </label>
      <label
        class="og-control-row"><input id="outline" type="checkbox" checked /> Show feature outlines</label>
      <p id="error" role="alert"></p>
      <p id="status" class="og-control-summary" role="status" aria-live="polite">Loading kernel…</p>
    </aside>
    <div id="app"></div>

    <script>
      if (location.protocol === 'file:') document.querySelector('#status').textContent = 'Open this page through the Vite server.';
      window.addEventListener('error', (event) => { document.querySelector('#status').textContent = `Error: ${event.message}`; }, true);
      window.addEventListener('unhandledrejection', (event) => { document.querySelector('#status').textContent = `Error: ${String(event.reason)}`; });
    </script>
    <script type="module" src="./sweep-arc-path.ts"></script>
  </body>
</html>
