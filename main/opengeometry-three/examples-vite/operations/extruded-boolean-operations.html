<!DOCTYPE html>
<html lang="en">
  <head>
    <title>OpenGeometry Extruded Boolean Example</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Exact through-cut workflow using strict analytic profile extrusions and in-house booleans."
    />
    <meta name="author" content="Vishwajeet Mane" />
  </head>
  <body class="og-example-page">
    <div class="og-badge-title-card">
      <a href="../index.html" class="og-badge-title-link">Back</a>
      <span class="og-badge-title">Extruded Boolean Operations</span>
    </div>

    <aside class="og-controls">
      <h3>Wall Minus Through Slot</h3>
      <p class="og-control-summary">
        This page builds coextensive strict-v2 profile extrusions and subtracts a through slot
        from the wall. Each result face keeps its planar support and source-face ancestry.
      </p>

      <label class="og-control-row" data-control="wall-height">
        <div class="og-control-header">
          <span class="og-control-label-chip">Wall Height</span>
          <code class="og-control-value" data-value>2.8</code>
        </div>
        <div class="og-control-range">
          <input data-range type="range" min="1.5" max="4" step="0.1" value="2.8" />
          <input data-number type="number" min="1.5" max="4" step="0.1" value="2.8" />
        </div>
      </label>

      <label class="og-control-row" data-control="opening-width">
        <div class="og-control-header">
          <span class="og-control-label-chip">Opening Width</span>
          <code class="og-control-value" data-value>1.4</code>
        </div>
        <div class="og-control-range">
          <input data-range type="range" min="0.6" max="2.2" step="0.05" value="1.4" />
          <input data-number type="number" min="0.6" max="2.2" step="0.05" value="1.4" />
        </div>
      </label>

      <pre id="result-report" style="white-space:pre-wrap" aria-live="polite"></pre>
      <p id="error" role="alert" style="color:#b42318"></p>
    </aside>

    <div id="app"></div>

    <script type="module">
      import "../src/styles/theme.css";
      import * as THREE from "three";
      import { OrbitControls } from "three/examples/jsm/controls/OrbitControls.js";
      import Stats from "three/examples/jsm/libs/stats.module.js";
      import wasmUrl from "../../../opengeometry/pkg/opengeometry_bg.wasm?url";
      import { AnalyticSolid, OpenGeometry } from "opengeometry";

      const app = document.getElementById("app");
      if (!app) {
        throw new Error("Missing #app container");
      }

      const config = {
        wallHeight: 2.8,
        openingWidth: 1.4,
      };

      let scene = null;
      let currentGroup = null;
      const readout = document.querySelector("#result-report");
      const errorReadout = document.querySelector("#error");

      function formatNumber(value) {
        return Number(value).toFixed(2).replace(/\.?0+$/, "");
      }

      function mountStats() {
        const stats = new Stats();
        stats.showPanel(0);
        stats.dom.style.position = "fixed";
        stats.dom.style.left = "12px";
        stats.dom.style.bottom = "12px";
        stats.dom.style.top = "auto";
        stats.dom.style.zIndex = "1000";
        document.body.appendChild(stats.dom);
        return stats;
      }

      function attachNumberControl(name, onChange) {
        const row = document.querySelector(`[data-control="${name}"]`);
        const range = row?.querySelector("[data-range]");
        const number = row?.querySelector("[data-number]");
        const value = row?.querySelector("[data-value]");

        if (!row || !range || !number || !value) {
          throw new Error(`Missing number control: ${name}`);
        }

        const commit = (nextValue) => {
          const parsed = Number(nextValue);
          if (String(nextValue).trim() === "" || !Number.isFinite(parsed) || parsed < Number(number.min) || parsed > Number(number.max)) {
            errorReadout.textContent = "Enter a value within the displayed limits; previous preview retained.";
            return;
          }

          range.value = String(parsed);
          number.value = String(parsed);
          value.textContent = formatNumber(parsed);
          onChange(parsed);
        };

        range.addEventListener("input", () => commit(range.value));
        number.addEventListener("input", () => commit(number.value));
        commit(range.value);
      }

      function disposeObject(object) {
        object.traverse((child) => {
          if (child instanceof AnalyticSolid) {
            child.dispose();
            return;
          }
          child.geometry?.dispose?.();
          if (Array.isArray(child.material)) {
            child.material.forEach((material) => material?.dispose?.());
            return;
          }
          child.material?.dispose?.();
        });
      }

      function rebuildExample() {
        if (!scene) {
          return;
        }

        const nextGroup = new THREE.Group();
        try {

          const wall = new AnalyticSolid({
            kind: "linearExtrusion",
            outer: [[-2.2, -0.18], [2.2, -0.18], [2.2, 0.18], [-2.2, 0.18]],
            holes: [],
            height: config.wallHeight,
            color: 0xdc2626,
            deflection: 0.01,
          });
          nextGroup.add(wall);
          wall.outline = true;
          wall.surface.material.transparent = true;
          wall.surface.material.opacity = 0.6;
          wall.surface.material.needsUpdate = true;

          const openingOuter = [
            [-config.openingWidth * 0.5, -0.26],
            [config.openingWidth * 0.5, -0.26],
            [config.openingWidth * 0.5, 0.26],
            [-config.openingWidth * 0.5, 0.26],
          ];
          const opening = new AnalyticSolid({
            kind: "linearExtrusion", outer: openingOuter, holes: [], height: config.wallHeight,
            color: 0xf97316, deflection: 0.01,
          });
          nextGroup.add(opening);
          opening.outline = true;

          const result = wall.subtract([opening], {
            color: 0xdc2626,
          });
          result.outline = true;

          wall.position.x = -4;
          opening.position.x = -4;
          result.position.x = 4;

          nextGroup.add(result);
          if (currentGroup) { scene.remove(currentGroup); disposeObject(currentGroup); }
          currentGroup = nextGroup;
          scene.add(currentGroup);
          readout.textContent = JSON.stringify(result.report, null, 2);
          errorReadout.textContent = "";

          console.groupCollapsed("[boolean-extruded] rebuilt");
          console.log("Config", { ...config });
          console.log("Report", result.report);
          console.groupEnd();
        } catch (failure) {
          disposeObject(nextGroup);
          errorReadout.textContent = `Previous preview retained. ${String(failure)}`;
        }
      }

      async function main() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xeef2ff);

        const camera = new THREE.PerspectiveCamera(
          55,
          window.innerWidth / window.innerHeight,
          0.1,
          100
        );
        camera.position.set(11.5, 6.8, 12.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        app.replaceChildren(renderer.domElement);

        const stats = mountStats();
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 1.6, 0);
        controls.update();

        scene.add(new THREE.GridHelper(30, 30, 0x4460ff, 0xd5ddff));
        scene.add(new THREE.AmbientLight(0xffffff, 0.82));

        const light = new THREE.DirectionalLight(0xffffff, 1.15);
        light.position.set(7, 9, 5);
        scene.add(light);

        await OpenGeometry.create({ wasmURL: wasmUrl });

        attachNumberControl("wall-height", (value) => {
          config.wallHeight = value;
          rebuildExample();
        });
        attachNumberControl("opening-width", (value) => {
          config.openingWidth = value;
          rebuildExample();
        });
        rebuildExample();

        renderer.setAnimationLoop(() => {
          stats.update();
          controls.update();
          renderer.render(scene, camera);
        });

        window.addEventListener("resize", () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        });
      }

      void main().catch(failure => { errorReadout.textContent = String(failure); });
    </script>
  </body>
</html>
