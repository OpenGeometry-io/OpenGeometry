<!DOCTYPE html>
<html lang="en">
  <head>
    <title>OpenGeometry Analytic Parametric Editing Example</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Strict BRep v2 parametric editing and face inspection in Three.js."
    />
    <meta name="author" content="Vishwajeet Mane" />
  </head>
  <body class="og-example-page">
    <div class="og-badge-title-card">
      <a href="../index.html" class="og-badge-title-link">Back</a>
      <span class="og-badge-title">Analytic Parametric Editing</span>
    </div>

    <aside class="og-controls">
      <h3>Guided Flow</h3>
      <p class="og-control-summary">
        Resize the authoritative six-plane cuboid, change its placement, then inspect its
        strict BRep v2 face topology.
      </p>

      <div class="og-control-row">
        <div class="og-control-header">
          <span class="og-control-label-chip">Status</span>
          <code class="og-control-value" data-status>ready</code>
        </div>
        <p class="og-control-summary" data-summary>
          Parametric edits rebuild analytic planes and trims without converting the model to triangles.
        </p>
      </div>

      <button class="og-control-action og-control-action-cyan" data-action="resize">
        Resize Parametric Cuboid
      </button>
      <button class="og-control-action og-control-action-amber" data-action="inspect">
        Inspect BRep v2
      </button>
      <button class="og-control-action og-control-action-rose" data-action="reset">
        Reset Demo
      </button>
    </aside>

    <div id="app"></div>

    <script type="module">
      import "../src/styles/theme.css";
      import * as THREE from "three";
      import { OrbitControls } from "three/examples/jsm/controls/OrbitControls.js";
      import Stats from "three/examples/jsm/libs/stats.module.js";
      import wasmUrl from "../../../opengeometry/pkg/opengeometry_bg.wasm?url";
      import { Cuboid, OpenGeometry, Vector3 } from "opengeometry";

      const app = document.getElementById("app");
      const statusNode = document.querySelector("[data-status]");
      const summaryNode = document.querySelector("[data-summary]");
      const resizeButton = document.querySelector('[data-action="resize"]');
      const inspectButton = document.querySelector('[data-action="inspect"]');
      const resetButton = document.querySelector('[data-action="reset"]');

      if (
        !app ||
        !statusNode ||
        !summaryNode ||
        !resizeButton ||
        !inspectButton ||
        !resetButton
      ) {
        throw new Error("Missing analytic editing example nodes");
      }

      let cuboid = null;
      let parametricEdited = false;

      function mountStats() {
        const stats = new Stats();
        stats.showPanel(0);
        stats.dom.style.position = "fixed";
        stats.dom.style.left = "12px";
        stats.dom.style.bottom = "12px";
        stats.dom.style.top = "auto";
        stats.dom.style.zIndex = "1000";
        document.body.appendChild(stats.dom);
        return stats;
      }

      function setStatus(status, summary) {
        statusNode.textContent = status;
        summaryNode.textContent = summary;
      }

      function resetCuboidState() {
        cuboid.setConfig({
          center: new Vector3(0, 0.75, 0),
          width: 1.4,
          height: 1.5,
          depth: 1.1,
          color: 0x2563eb,
          deflection: 0.005,
        });
        cuboid.setPlacement({
          translation: new Vector3(-2.5, 0, 0),
          rotation: new Vector3(0, 0, 0),
          scale: new Vector3(1, 1, 1),
        });
        cuboid.outline = true;
        parametricEdited = false;
      }

      function resizeParametricCuboid() {
        cuboid.setConfig({
          center: new Vector3(0, 0.95, 0),
          width: 1.9,
          height: 1.9,
          depth: 1.25,
          color: 0x2563eb,
          deflection: 0.005,
        });
        cuboid.setPlacement({
          translation: new Vector3(-2.5, 0, 0),
          rotation: new Vector3(0, Math.PI / 7, 0),
          scale: new Vector3(1, 1, 1),
        });
        cuboid.outline = true;
        parametricEdited = true;

        console.groupCollapsed("[editor-modes] parametric edit");
        console.log("Cuboid config", cuboid.getConfig());
        console.log("Placement", cuboid.getPlacement());
        console.groupEnd();

        setStatus(
          "parametric",
          "The cuboid was regenerated as six analytic plane faces and its placement remained separate."
        );
      }

      function inspectBrep() {
        const brep = cuboid.getBrepData();
        const faces = brep.topology.faces;
        console.groupCollapsed("[editor-modes] strict BRep v2");
        console.log("Parametric edited", parametricEdited);
        console.log("BRep", brep);
        console.groupEnd();
        setStatus("v2", `schema ${brep.schema_version}; ${faces.length} analytic plane faces; revision ${brep.revision}`);
      }

      function resetDemo() {
        resetCuboidState();
        setStatus(
          "ready",
          "Resize the cuboid, then inspect the strict analytic BRep v2 payload."
        );
      }

      async function main() {
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xeef2ff);

        const camera = new THREE.PerspectiveCamera(
          55,
          window.innerWidth / window.innerHeight,
          0.1,
          100
        );
        camera.position.set(9.2, 5.5, 10.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        app.replaceChildren(renderer.domElement);

        const stats = mountStats();
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 1.3, 0);
        controls.update();

        scene.add(new THREE.GridHelper(28, 28, 0x4460ff, 0xd5ddff));
        scene.add(new THREE.AmbientLight(0xffffff, 0.82));

        const light = new THREE.DirectionalLight(0xffffff, 1.15);
        light.position.set(7, 9, 5);
        scene.add(light);

        await OpenGeometry.create({ wasmURL: wasmUrl });

        cuboid = new Cuboid({
          center: new Vector3(0, 0.75, 0),
          width: 1.4,
          height: 1.5,
          depth: 1.1,
          color: 0x2563eb,
          deflection: 0.005,
        });
        scene.add(cuboid);

        resizeButton.addEventListener("click", resizeParametricCuboid);
        inspectButton.addEventListener("click", inspectBrep);
        resetButton.addEventListener("click", resetDemo);

        resetDemo();

        renderer.setAnimationLoop(() => {
          stats.update();
          controls.update();
          renderer.render(scene, camera);
        });

        window.addEventListener("resize", () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        });
      }

      void main();
    </script>
  </body>
</html>
