<!DOCTYPE html>
<html lang="en">
  <head>
    <title>OpenGeometry Pipe Segment Example</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="OpenGeometry pipe segment example for Three.js." />
    <meta name="author" content="Vishwajeet Mane" />
    <link rel="stylesheet" href="../theme.css" />
  </head>
  <body class="og-example-page">
    <div class="og-badge-title-card">
      <a href="../index.html" class="og-badge-title-link">Back</a>
      <span class="og-badge-title">Pipe Segment</span>
    </div>

    <aside class="og-controls">
      <h3>Pipe Segment</h3>
      <p class="og-control-summary">
        A ring sector extruded along the normal. Angles are radians from the x direction.
      </p>

      <label class="og-control-row" data-control="outerRadius">
        <div class="og-control-header">
          <span class="og-control-label-chip">Outer radius</span>
          <code class="og-control-value" data-value>0.8</code>
        </div>
        <div class="og-control-range">
          <input data-range type="range" min="0.2" max="2" step="0.05" value="0.8" />
          <input data-number type="number" min="0.2" max="2" step="0.05" value="0.8" />
        </div>
      </label>

      <label class="og-control-row" data-control="innerRadius">
        <div class="og-control-header">
          <span class="og-control-label-chip">Inner radius</span>
          <code class="og-control-value" data-value>0.6</code>
        </div>
        <div class="og-control-range">
          <input data-range type="range" min="0.05" max="1.9" step="0.05" value="0.6" />
          <input data-number type="number" min="0.05" max="1.9" step="0.05" value="0.6" />
        </div>
      </label>

      <label class="og-control-row" data-control="height">
        <div class="og-control-header">
          <span class="og-control-label-chip">Height</span>
          <code class="og-control-value" data-value>0.5</code>
        </div>
        <div class="og-control-range">
          <input data-range type="range" min="0.05" max="2" step="0.05" value="0.5" />
          <input data-number type="number" min="0.05" max="2" step="0.05" value="0.5" />
        </div>
      </label>

      <label class="og-control-row" data-control="startAngle">
        <div class="og-control-header">
          <span class="og-control-label-chip">Start angle</span>
          <code class="og-control-value" data-value>0</code>
        </div>
        <div class="og-control-range">
          <input data-range type="range" min="0" max="6.28" step="0.01" value="0" />
          <input data-number type="number" min="0" max="6.28" step="0.01" value="0" />
        </div>
      </label>

      <label class="og-control-row" data-control="sweepAngle">
        <div class="og-control-header">
          <span class="og-control-label-chip">Sweep angle</span>
          <code class="og-control-value" data-value>1.57</code>
        </div>
        <div class="og-control-range">
          <input data-range type="range" min="0.1" max="6.2" step="0.01" value="1.57" />
          <input data-number type="number" min="0.1" max="6.2" step="0.01" value="1.57" />
        </div>
      </label>
      <p id="status" class="og-control-summary" role="status" aria-live="polite">Loading kernel…</p>
    </aside>

    <div id="app"></div>

    <script>
      if (location.protocol === 'file:') document.querySelector('#status').textContent = 'Open this page through the Vite server.';
      window.addEventListener('error', (event) => { document.querySelector('#status').textContent = `Error: ${event.message}`; }, true);
      window.addEventListener('unhandledrejection', (event) => { document.querySelector('#status').textContent = `Error: ${String(event.reason)}`; });
    </script>
    <script type="module" src="./pipe-segment.ts"></script>
  </body>
</html>
