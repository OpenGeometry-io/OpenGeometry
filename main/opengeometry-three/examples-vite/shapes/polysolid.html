<!DOCTYPE html>
<html lang="en">
  <head>
    <title>OpenGeometry Polysolid Example</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="OpenGeometry polysolid wall example for Three.js." />
    <meta name="author" content="Vishwajeet Mane" />
    <link rel="stylesheet" href="../theme.css" />
  </head>
  <body class="og-example-page">
    <div class="og-badge-title-card">
      <a href="../index.html" class="og-badge-title-link">Back</a>
      <span class="og-badge-title">Polysolid</span>
    </div>

    <aside class="og-controls">
      <h3>Polysolid</h3>
      <p class="og-control-summary">
        A wall along an L-shaped path of straight legs or a path with a tangent arc, with width, height and justify.
      </p>

      <label class="og-control-row" data-control="width">
        <div class="og-control-header">
          <span class="og-control-label-chip">Width</span>
          <code class="og-control-value" data-value>0.2</code>
        </div>
        <div class="og-control-range">
          <input data-range type="range" min="0.05" max="0.6" step="0.05" value="0.2" />
          <input data-number type="number" min="0.05" max="0.6" step="0.05" value="0.2" />
        </div>
      </label>

      <label class="og-control-row" data-control="height">
        <div class="og-control-header">
          <span class="og-control-label-chip">Height</span>
          <code class="og-control-value" data-value>1</code>
        </div>
        <div class="og-control-range">
          <input data-range type="range" min="0.2" max="3" step="0.1" value="1" />
          <input data-number type="number" min="0.2" max="3" step="0.1" value="1" />
        </div>
      </label>

      <label class="og-control-row" data-control="path">
        <div class="og-control-header">
          <span class="og-control-label-chip">Path</span>
        </div>
        <select class="og-control-select" data-select aria-label="Path">
          <option value="legs" selected>Straight legs</option>
          <option value="arc">Leg and arc</option>
        </select>
      </label>

      <label class="og-control-row" data-control="justify">
        <div class="og-control-header">
          <span class="og-control-label-chip">Justify</span>
        </div>
        <select class="og-control-select" data-select aria-label="Justify">
          <option value="centre" selected>Centre</option>
          <option value="left">Left</option>
          <option value="right">Right</option>
        </select>
      </label>

      <label class="og-control-row" data-control="outline">
        <div class="og-control-header">
          <span class="og-control-label-chip">Outline</span>
        </div>
        <div class="og-control-bool">
          <input data-toggle type="checkbox" class="og-toggle" aria-label="Outline" checked />
          <span class="og-control-bool-state" data-state>Enabled</span>
        </div>
      </label>
      <p id="status" class="og-control-summary" role="status" aria-live="polite">Loading kernel…</p>
    </aside>

    <div id="app"></div>

    <script>
      if (location.protocol === 'file:') document.querySelector('#status').textContent = 'Open this page through the Vite server.';
      window.addEventListener('error', (event) => { document.querySelector('#status').textContent = `Error: ${event.message}`; }, true);
      window.addEventListener('unhandledrejection', (event) => { document.querySelector('#status').textContent = `Error: ${String(event.reason)}`; });
    </script>
    <script type="module" src="./polysolid.ts"></script>
  </body>
</html>
