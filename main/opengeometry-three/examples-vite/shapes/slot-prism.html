<!DOCTYPE html>
<html lang="en">
  <head>
    <title>OpenGeometry Slot Prism Example</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="OpenGeometry slot prism example for Three.js." />
    <meta name="author" content="Vishwajeet Mane" />
    <link rel="stylesheet" href="../theme.css" />
  </head>
  <body class="og-example-page">
    <div class="og-badge-title-card">
      <a href="../index.html" class="og-badge-title-link">Back</a>
      <span class="og-badge-title">Slot Prism</span>
    </div>

    <aside class="og-controls">
      <h3>Slot Prism</h3>
      <p class="og-control-summary">
        A stadium extruded along the normal: the slot length runs between the two arc centres.
      </p>

      <label class="og-control-row" data-control="length">
        <div class="og-control-header">
          <span class="og-control-label-chip">Length</span>
          <code class="og-control-value" data-value>1</code>
        </div>
        <div class="og-control-range">
          <input data-range type="range" min="0.1" max="3" step="0.05" value="1" />
          <input data-number type="number" min="0.1" max="3" step="0.05" value="1" />
        </div>
      </label>

      <label class="og-control-row" data-control="width">
        <div class="og-control-header">
          <span class="og-control-label-chip">Width</span>
          <code class="og-control-value" data-value>0.5</code>
        </div>
        <div class="og-control-range">
          <input data-range type="range" min="0.1" max="1.5" step="0.05" value="0.5" />
          <input data-number type="number" min="0.1" max="1.5" step="0.05" value="0.5" />
        </div>
      </label>

      <label class="og-control-row" data-control="height">
        <div class="og-control-header">
          <span class="og-control-label-chip">Height</span>
          <code class="og-control-value" data-value>0.4</code>
        </div>
        <div class="og-control-range">
          <input data-range type="range" min="0.05" max="2" step="0.05" value="0.4" />
          <input data-number type="number" min="0.05" max="2" step="0.05" value="0.4" />
        </div>
      </label>
      <p id="status" class="og-control-summary" role="status" aria-live="polite">Loading kernel…</p>
    </aside>

    <div id="app"></div>

    <script>
      if (location.protocol === 'file:') document.querySelector('#status').textContent = 'Open this page through the Vite server.';
      window.addEventListener('error', (event) => { document.querySelector('#status').textContent = `Error: ${event.message}`; }, true);
      window.addEventListener('unhandledrejection', (event) => { document.querySelector('#status').textContent = `Error: ${String(event.reason)}`; });
    </script>
    <script type="module" src="./slot-prism.ts"></script>
  </body>
</html>
