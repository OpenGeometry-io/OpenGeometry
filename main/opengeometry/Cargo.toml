[package]
name = "opengeometry"
version = "2.5.0"
edition = "2021"
license = "MPL-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[[test]]
name = "parity"
path = "tests/parity/main.rs"

[dependencies]
wasm-bindgen = "=0.2.100"
js-sys = "=0.3.77"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
earcutr = "=0.3.0"
console_error_panic_hook = "0.1"

[dev-dependencies]
wasm-bindgen-test = "=0.3.50"
sha2 = "0.10"
opengeometry-test-support = { path = "test-support" }

[profile.release]
codegen-units = 1
